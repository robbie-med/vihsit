name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Build
        run: node build.mjs
      - name: dist/vihsit.html is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/vihsit.html is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
